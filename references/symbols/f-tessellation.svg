    <polygon points="8,-52 12,-88 48,-92 62,-68 35,-62"/>
    <polygon points="35,-62 62,-68 88,-42 72,-15 48,-38"/>
    <polygon points="48,-38 72,-15 82,22 62,38 52,18"/>
    <polygon points="52,18 62,38 52,72 32,68 42,48"/>
    <polygon points="42,48 32,68 5,88 -18,72 -8,55"/>
