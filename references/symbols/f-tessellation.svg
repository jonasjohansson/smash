    <polygon points="-22,-98 -42,-130 -5,-138 25,-128 12,-88"/>
    <polygon points="12,-88 25,-128 62,-118 72,-92 48,-92"/>
    <polygon points="48,-92 72,-92 102,-62 88,-42 62,-68"/>
    <polygon points="88,-42 102,-62 118,-22 105,8 82,22 72,-15"/>
    <polygon points="82,22 105,8 112,48 95,72 62,38"/>
    <polygon points="62,38 95,72 78,105 52,98 52,72 32,68"/>
    <polygon points="32,68 52,98 28,118 2,112 5,88"/>
    <polygon points="5,88 2,112 -35,115 -52,92 -52,68 -18,72"/>
    <polygon points="-52,68 -52,92 -88,78 -88,48 -72,15 -52,42"/>
