<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- A. Full Radial Impact — most literal shattered glass -->
  <rect width="400" height="400" fill="white"/>
  <g transform="translate(200,200)" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round">
    <!-- Central impact void -->
    <polygon points="-8,-12 6,-15 18,-5 15,8 4,16 -10,12 -16,2" fill="white" stroke="black" stroke-width="2.5"/>

    <!-- Primary fracture lines radiating outward -->
    <line x1="-8" y1="-12" x2="-45" y2="-85"/>
    <line x1="-45" y1="-85" x2="-62" y2="-155"/>

    <line x1="6" y1="-15" x2="25" y2="-78"/>
    <line x1="25" y1="-78" x2="35" y2="-160"/>

    <line x1="18" y1="-5" x2="82" y2="-35"/>
    <line x1="82" y1="-35" x2="158" y2="-58"/>

    <line x1="15" y1="8" x2="75" y2="42"/>
    <line x1="75" y1="42" x2="150" y2="75"/>

    <line x1="4" y1="16" x2="15" y2="80"/>
    <line x1="15" y1="80" x2="22" y2="158"/>

    <line x1="-10" y1="12" x2="-65" y2="62"/>
    <line x1="-65" y1="62" x2="-130" y2="120"/>

    <line x1="-16" y1="2" x2="-85" y2="-8"/>
    <line x1="-85" y1="-8" x2="-162" y2="-15"/>

    <line x1="-16" y1="2" x2="-78" y2="28"/>
    <line x1="-78" y1="28" x2="-155" y2="52"/>

    <!-- Secondary fracture branches -->
    <line x1="-45" y1="-85" x2="-95" y2="-105"/>
    <line x1="-45" y1="-85" x2="-25" y2="-120"/>

    <line x1="25" y1="-78" x2="68" y2="-110"/>
    <line x1="25" y1="-78" x2="-5" y2="-115"/>

    <line x1="82" y1="-35" x2="115" y2="-90"/>
    <line x1="82" y1="-35" x2="120" y2="-8"/>

    <line x1="75" y1="42" x2="118" y2="18"/>
    <line x1="75" y1="42" x2="105" y2="95"/>

    <line x1="15" y1="80" x2="62" y2="110"/>
    <line x1="15" y1="80" x2="-28" y2="125"/>

    <line x1="-65" y1="62" x2="-45" y2="118"/>
    <line x1="-65" y1="62" x2="-110" y2="65"/>

    <line x1="-85" y1="-8" x2="-110" y2="-60"/>
    <line x1="-85" y1="-8" x2="-118" y2="32"/>

    <!-- Tertiary micro-fractures -->
    <line x1="-95" y1="-105" x2="-130" y2="-140" stroke-width="1.5"/>
    <line x1="68" y1="-110" x2="95" y2="-148" stroke-width="1.5"/>
    <line x1="115" y1="-90" x2="148" y2="-115" stroke-width="1.5"/>
    <line x1="120" y1="-8" x2="155" y2="12" stroke-width="1.5"/>
    <line x1="118" y1="18" x2="152" y2="38" stroke-width="1.5"/>
    <line x1="105" y1="95" x2="132" y2="135" stroke-width="1.5"/>
    <line x1="62" y1="110" x2="78" y2="152" stroke-width="1.5"/>
    <line x1="-28" y1="125" x2="-35" y2="-160" stroke-width="1.5"/>
    <line x1="-45" y1="118" x2="-68" y2="155" stroke-width="1.5"/>
    <line x1="-110" y1="65" x2="-148" y2="82" stroke-width="1.5"/>
    <line x1="-110" y1="-60" x2="-145" y2="-85" stroke-width="1.5"/>
    <line x1="-118" y1="32" x2="-155" y2="48" stroke-width="1.5"/>
  </g>
</svg>
