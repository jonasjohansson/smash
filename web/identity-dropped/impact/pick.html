<!doctype html>
<!-- Canonical candidates side by side: large, turned 90/180/270, at 64/32/16, and beside the word.
     ?places=lat,lon lat,lon …  plus any RULE override (?away=0.1). -->
<meta charset="utf-8">
<title>Impact: pick the mark</title>
<style>
  body { margin: 0; background: #0b0c0e; color: #ecebe6; font: 12px/1.3 ui-monospace, Menlo, monospace; }
  .row { display: flex; gap: 18px; align-items: center; padding: 14px 18px; border-bottom: 1px solid #222; }
  .row > span { width: 110px; opacity: 0.6; }
  svg { display: block; }
  .paper { background: #ecebe6; padding: 16px; display: flex; gap: 22px; align-items: center; }
  .rot { display: flex; gap: 14px; }
  .small { display: flex; gap: 10px; align-items: end; }
</style>
<body>
<script type="module">
  import { fracture, pathOf, placeSeed } from './fracture.js';
  import { wordmark } from '../impact.js';
  const q = new URLSearchParams(location.search);
  const over = {};
  for (const [k, v] of q) if (k !== 'places') over[k] = v.includes(',') ? v.split(',').map(Number) : isNaN(+v) ? v : +v;
  const box = (f) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const s of f.shards) if (!s.dropped) for (const [x, y] of s.poly) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  };
  const draw = (f, px, { rot = 0, fill = '#ecebe6' } = {}) => {
    const b = box(f);
    const s = (px * 0.92) / Math.max(b.w, b.h);
    const dx = px / 2 - (b.x0 + b.w / 2) * s;
    const dy = px / 2 - (b.y0 + b.h / 2) * s;
    const d = f.shards.filter((sh) => !sh.dropped).map((sh) => pathOf(sh.poly, s, dx, dy)).join('');
    return `<svg viewBox="0 0 ${px} ${px}" width="${px}" height="${px}"><path d="${d}" fill="${fill}" transform="rotate(${rot} ${px / 2} ${px / 2})"/></svg>`;
  };
  const word = wordmark({ ground: 'paper' });
  for (const pl of (q.get('places') ?? '').split(' ').filter(Boolean)) {
    const [la, lo] = pl.split(',').map(Number);
    const f = fracture(placeSeed(la, lo), over);
    const f0 = fracture(placeSeed(la, lo), { ...over, burst: 0 });
    const b = box(f0);
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span>${la.toFixed(4)} ${lo.toFixed(4)}<br>n${f.n} ${Math.round(f.dir / Math.PI * 180)}° ${f.spread}°</span>`
      + draw(f, 260)
      + `<div class="rot">${[90, 180, 270].map((r) => draw(f, 110, { rot: r })).join('')}</div>`
      + `<div class="small">${draw(f0, 64)}${draw(f0, 32)}${draw(f0, 16)}</div>`
      + `<div class="paper"><div style="height:64px">${draw(f0, 64, { fill: '#0b0c0e' })}</div>${word.replace('<svg ', '<svg style="height:40px;color:#0b0c0e" ')}</div>`;
    document.body.appendChild(row);
  }
  document.documentElement.dataset.ready = '1';
</script>
