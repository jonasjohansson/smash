<!doctype html>
<!-- Seeds and places side by side: ?seeds=1,2,3 or ?from=1&count=20 or ?grid=lat0,lat1,dlat,lon0,lon1,dlon,
     plus any RULE override (?gap=0.12&burst=0.1), ?n=5 to show only that many shards, ?debug=1 for the hit. -->
<meta charset="utf-8">
<title>Impact: seed explorer</title>
<style>
  body { margin: 0; background: #0b0c0e; color: #ecebe6; font: 12px/1.3 ui-monospace, Menlo, monospace; }
  .grid { display: grid; grid-template-columns: repeat(var(--cols, 5), 1fr); gap: 1px; background: #222; }
  .cell { background: #0b0c0e; padding: 12px; position: relative; }
  .cell > svg { display: block; width: 100%; height: auto; }
  .cell span { position: absolute; left: 8px; top: 6px; opacity: 0.55; font-size: 11px; }
  .small { display: flex; gap: 6px; position: absolute; right: 8px; bottom: 8px; align-items: end; }
  h2 { font-weight: 400; margin: 12px; font-size: 14px; }
</style>
<body>
<script type="module">
  import { fracture, pathOf, placeSeed } from './fracture.js';
  const q = new URLSearchParams(location.search);
  const over = {};
  const own = ['dirs', 'seeds', 'cols', 'from', 'count', 'grid', 'debug', 'only', 'size', 'places', 'smalls'];
  for (const [k, v] of q) if (!own.includes(k)) over[k] = v.includes(',') ? v.split(',').map(Number) : isNaN(+v) ? v : +v;
  const from = +(q.get('from') ?? 1);
  const count = +(q.get('count') ?? 20);
  let seeds = q.get('seeds') ? q.get('seeds').split(',').map(Number) : [...Array(count)].map((_, i) => from + i);
  const labels = {};
  if (q.get('grid')) {
    const [la0, la1, dla, lo0, lo1, dlo] = q.get('grid').split(',').map(Number);
    seeds = [];
    for (let la = la0; la <= la1 + 1e-9; la += dla) for (let lo = lo0; lo <= lo1 + 1e-9; lo += dlo) {
      const sd = placeSeed(+la.toFixed(4), +lo.toFixed(4));
      seeds.push(sd);
      labels[sd] = `${la.toFixed(4)} ${lo.toFixed(4)}`;
    }
  }
  if (q.get('places')) {
    seeds = [];
    for (const pl of q.get('places').split(' ')) {
      const [la, lo] = pl.split(',').map(Number);
      const sd = placeSeed(la, lo);
      seeds.push(sd);
      labels[sd] = `${la.toFixed(4)} ${lo.toFixed(4)}`;
    }
  }
  const only = q.get('only') ? +q.get('only') : 0;
  const size = +(q.get('size') ?? 300);
  document.body.style.setProperty('--cols', q.get('cols') ?? 5);
  const box = (f) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const s of f.shards) if (!s.dropped) for (const [x, y] of s.poly) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  };
  const draw = (f, px, debug = false) => {
    const b = box(f);
    const s = (px * 0.9) / Math.max(b.w, b.h);
    const dx = px / 2 - (b.x0 + b.w / 2) * s;
    const dy = px / 2 - (b.y0 + b.h / 2) * s;
    const d = f.shards.filter((sh) => !sh.dropped).map((sh) => pathOf(sh.poly, s, dx, dy)).join('');
    const dbg = debug ? `<circle cx="${dx}" cy="${dy}" r="3" fill="#2d5bff"/><line x1="${dx}" y1="${dy}" x2="${dx + Math.cos(f.dir) * 40}" y2="${dy + Math.sin(f.dir) * 40}" stroke="#2d5bff"/>` : '';
    return `<svg viewBox="0 0 ${px} ${px}" width="${px}" height="${px}"><path d="${d}" fill="#ecebe6"/>${dbg}</svg>`;
  };
  document.body.insertAdjacentHTML('beforeend', `<h2>${JSON.stringify(over)}</h2>`);
  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const seed of seeds) {
    const f = fracture(seed, over);
    if (only && f.n !== only) continue;
    if (q.get('dirs') && !q.get('dirs').split(',').map(Number).includes(Math.round(f.dir * 180 / Math.PI))) continue;
    const b = box(f);
    const off = Math.hypot((b.x0 + b.w / 2) / b.w, (b.y0 + b.h / 2) / b.h);
    const fb = f.stream ? ` s${f.stream}` : '';
    grid.insertAdjacentHTML('beforeend', `<div class="cell"><span>${labels[seed] ?? seed} · n${f.n} · ${Math.round(f.dir * 180 / Math.PI)}° · ${f.spread}° · ${(b.w / b.h).toFixed(2)}${fb}</span>${draw(f, size, q.has('debug'))}${q.has('smalls') ? `<div class="small">${draw(f, 64)}${draw(f, 32)}${draw(f, 16)}</div>` : ''}</div>`);
  }
  document.body.appendChild(grid);
  document.documentElement.dataset.ready = '1';
</script>
