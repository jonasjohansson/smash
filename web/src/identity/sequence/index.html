<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>SMASH sequence</title>
  <link rel="stylesheet" href="sequence.css">
  <script type="module" src="sequence.js"></script>
</head>
<body>
  <main class="seq">
    <svg class="mark" aria-label="SMASH, from the logo to the modular mark, the S M, the S and its corner square" role="img"></svg>
    <div class="bar">
      <button type="button" class="play" aria-label="Play or pause"><svg viewBox="0 0 10 10" aria-hidden="true"><path class="i-pause" d="M2 1h2v8H2zM6 1h2v8H6z"/><path class="i-play" d="M2 1l7 4-7 4z"/></svg></button>
      <input type="range" class="scrub" min="0" max="1000" value="0" aria-label="Scrub the sequence">
      <button type="button" class="sound" aria-label="Sound on or off"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3.5h2l2.5-2v7L3 6.5H1z"/><path class="i-waves" d="M6.8 3.2a2.6 2.6 0 0 1 0 3.6M8 2a4.2 4.2 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round"/><path class="i-off" d="M6.6 3.4l2.6 3.2M9.2 3.4L6.6 6.6" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round"/></svg></button>
      <a class="download" href="video/smash-sequence.mp4" download aria-label="Download the sequence as an MP4, with its sound"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M4.4 1h1.2v4.6l1.7-1.7.85.85L5 7.9 1.85 4.75l.85-.85 1.7 1.7zM1.5 8.4h7v1.1h-7z"/></svg></a>
      <button type="button" class="invert" aria-label="Black on white, or white on black"><svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5 1a4 4 0 0 1 0 8z"/></svg></button>
    </div>
  </main>
</body>
</html>
